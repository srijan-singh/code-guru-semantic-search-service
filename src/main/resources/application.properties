# Application Configuration
spring.application.name=semantic-search-service

# Ollama Configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=nomic-embed-text:latest

# Qdrant Vector Store Configuration
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:localhost}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.collection-name=code-chunks
spring.ai.vectorstore.qdrant.use-tls=false

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.code.guru.sematic=DEBUG
logging.level.org.springframework.ai=DEBUG
